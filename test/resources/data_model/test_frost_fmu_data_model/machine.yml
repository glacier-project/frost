name: "machine"
machine_category: "unknown"
machine_type: "unknown"
machine_model: "unknown"
description: "Feedthrough FMU: inputs and outputs exposed as variable nodes"
root:
  !!FolderNode
  name: "Machine"
  description: ""
  children:
    - !!FolderNode
      name: "inputs"
      description: "Written by other nodes; every write triggers the FMU"
      children:
        - !!NumericalVariableNode
          name: "Float64_continuous_input"
          description: ""
          initial_value: 0
    - !!FolderNode
      name: "outputs"
      description: "Written by the FMU at every commit"
      children:
        - !!NumericalVariableNode
          name: "Float64_continuous_output"
          description: ""
          initial_value: -1
    - !!FolderNode
      name: "parameters"
      description: "FMU parameters, published at every commit"
      children:
        - !!NumericalVariableNode
          name: "Float64_fixed_parameter"
          description: ""
          initial_value: -1
        - !!NumericalVariableNode
          name: "Float64_tunable_parameter"
          description: ""
          initial_value: -1
