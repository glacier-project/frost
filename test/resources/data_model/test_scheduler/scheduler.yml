name: "scheduler" 
root:
  !!FolderNode
  name: "Scheduler"
  description: ""
  children:
    - !!CompositeMethodNode
      name: "StartTask1"
      parameters: 
        - !!StringVariableNode
          name: "remote_machine"
      cfg:
        - !!CallRemoteMethodNode
          method: "/Machine/StartTask1"
          remote_id: "${remote_machine}"
        - !!WaitRemoteEventNode
          variable: "/Machine/Busy"
          remote_id: "${remote_machine}"
          rhs: false
          operator: "=="
    - !!CompositeMethodNode
      name: "StartTask2"
      parameters: 
        - !!StringVariableNode
          name: "remote_machine"
      cfg:
        - !!CallRemoteMethodNode
          method: "/Machine/StartTask2"
          remote_id: "${remote_machine}"
        - !!WaitRemoteEventNode
          variable: "/Machine/Busy"
          remote_id: "${remote_machine}"
          rhs: false
          operator: "=="
    - !!CompositeMethodNode
      name: "StartTask3"
      parameters: 
        - !!StringVariableNode
          name: "remote_machine"
      cfg:
        - !!CallRemoteMethodNode
          method: "/Machine/StartTask3"
          remote_id: "${remote_machine}"
        - !!WaitRemoteEventNode
          variable: "/Machine/Busy"
          remote_id: "${remote_machine}"
          rhs: false
          operator: "=="
