time_precision: NSECS
logging_level: INFO
reactors:
  frost_link:
    logging_level: WARNING
    parameters:
      data_model_path: "resources/data_model/test_elevator/link.yml"
    reactors:
      message_filter:
        logging_level: WARNING
  elevator:
    logging_level: WARNING
    parameters:
      path: "resources/fmu/Elevator5.fmu"
      data_model_path: "resources/data_model/test_elevator/elevator.yml"
      step_size: 0.4
    reactors:
      message_filter:
        logging_level: WARNING
  passenger:
    logging_level: WARNING
    parameters:
      data_model_path: "resources/data_model/test_elevator/passenger.yml"
    reactors:
      message_filter:
        logging_level: WARNING
