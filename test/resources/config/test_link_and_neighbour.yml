time_precision: NSECS
logging_level: INFO
reactors:
  frost_link:
    logging_level: WARNING
    parameters:
      data_model_path: "resources/data_model/test_link_and_neighbour/link.yml"
    reactors:
      message_filter:
        logging_level: WARNING
  device_a:
    logging_level: INFO
    parameters:
      data_model_path: "resources/data_model/test_link_and_neighbour/device_a.yml"
      peer: "device_b"
    reactors:
      message_filter:
        logging_level: WARNING
  device_b:
    logging_level: INFO
    parameters:
      data_model_path: "resources/data_model/test_link_and_neighbour/device_b.yml"
    reactors:
      message_filter:
        logging_level: WARNING
